name: Solidity CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge install foundry-rs/forge-std --no-commit
      - run: forge fmt --check
      - run: forge build
      - run: forge test -vv
