name: X Layer Builder Code Live Proof

on:
  push:
    branches:
      - agent/noema-integration-lab
    paths:
      - '.github/workflows/builder-code-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder-code-live:
    runs-on: ubuntu-24.04
    env:
      XLAYER_RPC_URL: https://testrpc.xlayer.tech/terigon
      XLAYER_EXPECTED_CHAIN_ID: '1952'
      XLAYER_BUILDER_REGISTRY: '0x33907e98d7392d95212b05ab03f091e02d7815bf'
      NOEMA_XLAYER_PUBLISHER_PRIVATE_KEY: ${{ secrets.NOEMA_XLAYER_PUBLISHER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Preflight current X Layer Builder Code registry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOEMA_XLAYER_PUBLISHER_PRIVATE_KEY" || { echo '::error::Missing funded X Layer signer secret'; exit 2; }
          CHAIN_ID=$(cast chain-id --rpc-url "$XLAYER_RPC_URL")
          test "$CHAIN_ID" = "$XLAYER_EXPECTED_CHAIN_ID" || { echo "::error::Unexpected chain ID $CHAIN_ID"; exit 2; }
          SIGNER=$(cast wallet address --private-key "$NOEMA_XLAYER_PUBLISHER_PRIVATE_KEY")
          BALANCE=$(cast balance "$SIGNER" --rpc-url "$XLAYER_RPC_URL")
          REGISTRY_CODE=$(cast code "$XLAYER_BUILDER_REGISTRY" --rpc-url "$XLAYER_RPC_URL")
          test "$BALANCE" != '0' || { echo '::error::Signer has zero testnet OKB'; exit 2; }
          test "$REGISTRY_CODE" != '0x' || { echo '::error::Current documented Builder Code registry has no bytecode'; exit 2; }
          mkdir -p artifacts/qa/builder-code
          printf '%s\n' "$REGISTRY_CODE" > artifacts/qa/builder-code/registry-runtime-bytecode.hex
          echo "Signer: $SIGNER"
          echo "Builder Code registry: $XLAYER_BUILDER_REGISTRY"
          echo "Registry bytecode bytes: $(( (${#REGISTRY_CODE} - 2) / 2 ))"
          echo "XLAYER_SIGNER=$SIGNER" >> "$GITHUB_ENV"

      - name: Probe Builder Code registry state and registerAuto simulation
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/qa/builder-code
          NAME=$(cast call "$XLAYER_BUILDER_REGISTRY" 'name()(string)' --rpc-url "$XLAYER_RPC_URL" 2>&1 || true)
          SYMBOL=$(cast call "$XLAYER_BUILDER_REGISTRY" 'symbol()(string)' --rpc-url "$XLAYER_RPC_URL" 2>&1 || true)
          OWNER_BALANCE=$(cast call "$XLAYER_BUILDER_REGISTRY" 'balanceOf(address)(uint256)' "$XLAYER_SIGNER" --rpc-url "$XLAYER_RPC_URL" 2>&1 || true)
          TOTAL_SUPPLY=$(cast call "$XLAYER_BUILDER_REGISTRY" 'totalSupply()(uint256)' --rpc-url "$XLAYER_RPC_URL" 2>&1 || true)
          TOKEN_ZERO=$(cast call "$XLAYER_BUILDER_REGISTRY" 'tokenOfOwnerByIndex(address,uint256)(uint256)' "$XLAYER_SIGNER" 0 --rpc-url "$XLAYER_RPC_URL" 2>&1 || true)
          REGISTER_SIM=$(cast call "$XLAYER_BUILDER_REGISTRY" 'registerAuto()' --from "$XLAYER_SIGNER" --rpc-url "$XLAYER_RPC_URL" 2>&1 || true)
          REGISTER_DATA=$(cast calldata 'registerAuto()')
          RAW_SIM=$(cast rpc --rpc-url "$XLAYER_RPC_URL" eth_call "{\"from\":\"$XLAYER_SIGNER\",\"to\":\"$XLAYER_BUILDER_REGISTRY\",\"data\":\"$REGISTER_DATA\"}" latest 2>&1 || true)

          jq -n \
            --arg registry "$XLAYER_BUILDER_REGISTRY" \
            --arg signer "$XLAYER_SIGNER" \
            --arg name "$NAME" \
            --arg symbol "$SYMBOL" \
            --arg ownerBalance "$OWNER_BALANCE" \
            --arg totalSupply "$TOTAL_SUPPLY" \
            --arg tokenZero "$TOKEN_ZERO" \
            --arg registerSimulation "$REGISTER_SIM" \
            --arg rawSimulation "$RAW_SIM" \
            '{kind:"xlayer-builder-code-probe",chainId:1952,registry:$registry,signer:$signer,name:$name,symbol:$symbol,ownerBalance:$ownerBalance,totalSupply:$totalSupply,tokenOfOwnerByIndex0:$tokenZero,registerAutoSimulation:$registerSimulation,rawEthCall:$rawSimulation}' \
            > artifacts/qa/builder-code/probe.json

          echo "Collection name: $NAME"
          echo "Collection symbol: $SYMBOL"
          echo "Signer NFT balance: $OWNER_BALANCE"
          echo "Total supply: $TOTAL_SUPPLY"
          echo "tokenOfOwnerByIndex(0): $TOKEN_ZERO"
          echo "registerAuto simulation: $REGISTER_SIM"
          echo "raw eth_call: $RAW_SIM"

          if [[ "$OWNER_BALANCE" =~ ^[1-9][0-9]*$ ]] && [[ "$TOKEN_ZERO" =~ ^[0-9]+$ ]]; then
            echo "XLAYER_BUILDER_TOKEN_ID=$TOKEN_ZERO" >> "$GITHUB_ENV"
          fi

      - name: Inspect existing Builder Code NFT when present
        if: env.XLAYER_BUILDER_TOKEN_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_ID="$XLAYER_BUILDER_TOKEN_ID"
          OWNER=$(cast call "$XLAYER_BUILDER_REGISTRY" 'ownerOf(uint256)(address)' "$TOKEN_ID" --rpc-url "$XLAYER_RPC_URL")
          TOKEN_URI=$(cast call "$XLAYER_BUILDER_REGISTRY" 'tokenURI(uint256)(string)' "$TOKEN_ID" --rpc-url "$XLAYER_RPC_URL" 2>&1 || true)
          jq -n --arg tokenId "$TOKEN_ID" --arg owner "$OWNER" --arg tokenURI "$TOKEN_URI" \
            '{kind:"xlayer-builder-code-existing-token",tokenId:$tokenId,owner:$owner,tokenURI:$tokenURI}' \
            > artifacts/qa/builder-code/existing-token.json
          echo "Existing Builder Code token: $TOKEN_ID"
          echo "Token URI: $TOKEN_URI"

      - name: Upload Builder Code probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xlayer-builder-code-probe-${{ github.sha }}
          path: artifacts/qa/builder-code/*
          if-no-files-found: warn
          retention-days: 30
